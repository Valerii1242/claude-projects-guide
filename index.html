<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Projects — интерактивный гайд</title><style>body{font-family:Arial,sans-serif;background:#f8f6f1;color:#29262d;display:grid;place-items:center;min-height:100vh;margin:0}.load{text-align:center;padding:28px}.load b{display:block;margin-bottom:10px}</style></head><body><div class="load"><b>CLAUDE PROJECTS</b>Загружаю интерактивный гайд…</div><script>(async()=>{try{const ps=Array.from({length:3},(_,i)=>`site/source${String(i+1).padStart(2,'0')}.txt`);const t=await Promise.all(ps.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+': '+r.status);return r.text()}));let h=t.join('');h=h.replace('</body>','<script src="js/assets-loader.js"><\/script></body>');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div class="load"><b>Не удалось загрузить гайд</b>Обновите страницу. Если ошибка повторится, сообщите автору.</div>';console.error(e)}})();</script></body></html>
